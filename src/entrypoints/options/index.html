<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmark Sync - Settings</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Bookmark Sync Settings</h1>

      <section class="section">
        <h2>Storage Backend</h2>
        <div class="form-group">
          <label for="backend-type">Backend Type</label>
          <select id="backend-type">
            <option value="webdav">WebDAV</option>
            <option value="s3">S3</option>
          </select>
        </div>

        <div id="webdav-config">
          <div class="form-group">
            <label for="webdav-url">WebDAV URL</label>
            <input type="url" id="webdav-url" placeholder="https://dav.example.com/bookmarks/" />
          </div>
          <div class="form-group">
            <label for="webdav-username">Username</label>
            <input type="text" id="webdav-username" placeholder="username" />
          </div>
          <div class="form-group">
            <label for="webdav-password">Password</label>
            <input type="password" id="webdav-password" placeholder="password" />
          </div>
        </div>

        <div id="s3-config" class="hidden">
          <div class="form-group">
            <label for="s3-endpoint">Endpoint URL</label>
            <input type="url" id="s3-endpoint" placeholder="https://s3.amazonaws.com" />
          </div>
          <div class="form-group">
            <label for="s3-bucket">Bucket</label>
            <input type="text" id="s3-bucket" placeholder="my-bookmarks" />
          </div>
          <div class="form-group">
            <label for="s3-region">Region</label>
            <input type="text" id="s3-region" placeholder="us-east-1" />
          </div>
          <div class="form-group">
            <label for="s3-access-key">Access Key ID</label>
            <input type="text" id="s3-access-key" placeholder="AKIA..." />
          </div>
          <div class="form-group">
            <label for="s3-secret-key">Secret Access Key</label>
            <input type="password" id="s3-secret-key" placeholder="secret" />
          </div>
          <div class="form-group checkbox-group">
            <label for="s3-path-style">
              <input type="checkbox" id="s3-path-style" />
              <span>Path-style endpoint (enable for MinIO / self-hosted; leave off for AWS, Tencent COS, Cloudflare R2)</span>
            </label>
          </div>
        </div>
      </section>

      <section class="section">
        <h2>Sync Schedule</h2>
        <div class="form-group">
          <label for="sync-interval">Sync Interval</label>
          <select id="sync-interval">
            <option value="5">Every 5 minutes</option>
            <option value="15">Every 15 minutes</option>
            <option value="30" selected>Every 30 minutes</option>
            <option value="60">Every hour</option>
            <option value="360">Every 6 hours</option>
            <option value="720">Every 12 hours</option>
            <option value="1440">Every 24 hours</option>
          </select>
        </div>
      </section>

      <div class="actions">
        <button id="test-btn" class="btn-secondary">Test Connection</button>
        <button id="save-btn" class="btn-primary">Save Settings</button>
      </div>
      <div id="message" class="message hidden"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
